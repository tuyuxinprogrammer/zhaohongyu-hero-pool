<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://tuyuxinprogrammer.github.io">
<link rel="dns-prefetch" href="https://tuyuxinprogrammer.github.io">
<title>赵宏宇专属奖池</title>
<style>
/* ========== CSS Reset & Variables ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink: #e8a0b4;
  --pink-light: #fce4ec;
  --pink-dark: #c47a8f;
  --rose: #d4859b;
  --rose-glow: rgba(212,133,155,0.25);
  --lavender: #d4c5e8;
  --lavender-light: #f3eef9;
  --white: #ffffff;
  --card-bg: rgba(255,255,255,0.78);
  --card-bg-hover: rgba(255,255,255,0.95);
  --card-border: rgba(232,160,180,0.2);
  --text: #4a3040;
  --text-dim: #b8a0ae;
  --text-light: #7a6070;
  --accent-jungle: #81c784;
  --accent-mid: #64b5f6;
  --accent-slave: #ffb74d;
  --accent-prison: #ba68c8;
  --danger: #ef5350;
  --radius: 16px;
  --radius-lg: 22px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --shadow-card: 0 1px 12px rgba(200,150,170,0.12), 0 0 0 1px rgba(232,160,180,0.08);
  --shadow-card-hover: 0 6px 24px rgba(200,150,170,0.2), 0 0 0 2px rgba(232,160,180,0.15);
  --shadow-soft: 0 2px 8px rgba(180,130,150,0.1);
}

html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(165deg, #fef8fa 0%, #fdf2f6 15%, #faf4fc 40%, #fef8fa 65%, #fdf3f7 85%, #faf5fb 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ========== Floating Blobs Background ========== */
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.bg-blob {
  position: absolute; border-radius: 50%;
  animation: blobFloat 10s ease-in-out infinite;
  filter: blur(60px);
  opacity: 0.5;
}
.bg-blob:nth-child(1) { width: 300px; height: 300px; background: rgba(232,160,180,0.3); left: -5%; top: -10%; animation-delay: 0s; }
.bg-blob:nth-child(2) { width: 250px; height: 250px; background: rgba(212,197,232,0.3); right: -5%; top: 30%; animation-delay: 3s; animation-duration: 12s; }
.bg-blob:nth-child(3) { width: 200px; height: 200px; background: rgba(247,208,219,0.35); left: 40%; bottom: -10%; animation-delay: 6s; animation-duration: 9s; }
.bg-blob:nth-child(4) { width: 180px; height: 180px; background: rgba(212,133,155,0.2); left: 20%; top: 50%; animation-delay: 2s; animation-duration: 11s; }

@keyframes blobFloat {
  0% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -20px) scale(1.05); }
  66% { transform: translate(-20px, 15px) scale(0.95); }
  100% { transform: translate(0, 0) scale(1); }
}

/* Chen Duling portrait watermark */
.bg-portrait {
  position: absolute; right: 10px; top: 15%;
  width: 220px; height: 300px;
  background-size: cover; background-position: center top;
  border-radius: 24px;
  opacity: 0.18;
  filter: drop-shadow(0 8px 24px rgba(180,140,160,0.2));
  transition: background-image 1.5s ease, opacity 1.5s ease;
  border: 1px solid rgba(232,160,180,0.15);
}
.bg-portrait.bottom {
  left: 15px; right: auto; top: auto; bottom: 10%;
  width: 200px; height: 270px;
  opacity: 0.16;
}

@media (max-width: 480px) {
  .bg-portrait { width: 140px; height: 200px; right: -10px; opacity: 0.14; }
  .bg-portrait.bottom { width: 130px; height: 180px; left: -10px; opacity: 0.12; }
}

/* ========== Sparkle Dots ========== */
.bg-sparkles {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(2.5px 2.5px at 12% 18%, rgba(232,160,180,0.45), transparent),
    radial-gradient(2px 2px at 28% 38%, rgba(212,197,232,0.4), transparent),
    radial-gradient(2.5px 2.5px at 45% 22%, rgba(247,208,219,0.35), transparent),
    radial-gradient(2px 2px at 62% 48%, rgba(212,133,155,0.35), transparent),
    radial-gradient(2.5px 2.5px at 75% 32%, rgba(212,197,232,0.35), transparent),
    radial-gradient(2px 2px at 88% 52%, rgba(232,160,180,0.4), transparent),
    radial-gradient(2.5px 2.5px at 15% 70%, rgba(212,133,155,0.35), transparent),
    radial-gradient(2px 2px at 38% 82%, rgba(212,197,232,0.3), transparent),
    radial-gradient(2.5px 2.5px at 58% 78%, rgba(247,208,219,0.35), transparent),
    radial-gradient(2px 2px at 80% 85%, rgba(232,160,180,0.3), transparent),
    radial-gradient(2.5px 2.5px at 92% 14%, rgba(212,197,232,0.3), transparent);
  animation: sparkle 4s ease-in-out infinite alternate;
}
@keyframes sparkle {
  0% { opacity: 0.45; }
  100% { opacity: 0.85; }
}

/* ========== Layout ========== */
.container {
  position: relative; z-index: 1;
  max-width: 700px; margin: 0 auto; padding: 20px 16px 60px;
}

/* ========== Header ========== */
.header {
  text-align: center; padding: 36px 0 24px;
}
.header-avatar {
  width: 96px; height: 96px; margin: 0 auto 18px;
  border-radius: 50%; object-fit: cover;
  border: 3px solid rgba(232,160,180,0.5);
  box-shadow: 0 4px 24px rgba(212,133,155,0.3);
  display: block;
  transition: transform var(--transition);
}
.header-avatar:hover { transform: scale(1.08); }

/* Chen Duling decorative banner */
.cd-banner {
  display: flex; gap: 10px; justify-content: center;
  margin: 0 auto 20px; max-width: 500px;
  flex-wrap: wrap;
}
.cd-banner-img {
  width: 100px; height: 100px; object-fit: cover;
  border-radius: var(--radius);
  border: 2px solid rgba(232,160,180,0.3);
  box-shadow: 0 2px 12px rgba(200,150,170,0.18);
  transition: all var(--transition);
  cursor: default;
}
.cd-banner-img:hover {
  transform: translateY(-4px) scale(1.03);
  border-color: var(--pink);
  box-shadow: 0 6px 20px rgba(212,133,155,0.3);
}
.header h1 {
  font-size: clamp(1.5rem, 4.5vw, 2.3rem);
  font-weight: 800;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, #d4859b 0%, #c4a0d0 40%, #d4859b 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 1px 3px rgba(212,133,155,0.25));
  line-height: 1.4;
}
.header .subtitle {
  font-size: 0.85rem; color: var(--text-dim);
  margin-top: 6px; letter-spacing: 0.12em;
}

/* ========== Page Switching ========== */
.page { display: none; }
.page.active { display: block; animation: fadeSlideIn 0.35s ease-out; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Lane Selection Grid ========== */
.lane-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
  gap: 14px;
  margin-top: 24px;
}
.lane-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 26px 14px 22px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.lane-card:hover {
  transform: translateY(-5px);
  background: var(--card-bg-hover);
  border-color: var(--pink);
  box-shadow: var(--shadow-card-hover);
}
.lane-card:active { transform: translateY(-2px); }

.lane-icon {
  width: 52px; height: 52px; margin: 0 auto 12px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; position: relative; z-index: 1;
}
.lane-icon.jungle { background: rgba(129,199,132,0.13); box-shadow: 0 0 14px rgba(129,199,132,0.12); }
.lane-icon.mid    { background: rgba(100,181,246,0.13); box-shadow: 0 0 14px rgba(100,181,246,0.12); }
.lane-icon.slave  { background: rgba(255,183,77,0.13); box-shadow: 0 0 14px rgba(255,183,77,0.12); }
.lane-icon.prison { background: rgba(186,104,200,0.13); box-shadow: 0 0 14px rgba(186,104,200,0.12); }

.lane-name {
  font-size: 1.05rem; font-weight: 700; position: relative; z-index: 1;
  color: var(--text); letter-spacing: 0.04em;
}
.lane-count {
  font-size: 0.73rem; color: var(--text-dim); margin-top: 4px; position: relative; z-index: 1;
}

/* ========== Main Pool Page ========== */
.top-bar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.btn-back {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text-light);
  border: 1px solid var(--card-border);
  border-radius: 999px; padding: 8px 18px;
  font-size: 0.84rem; cursor: pointer;
  transition: all var(--transition); white-space: nowrap;
}
.btn-back:hover {
  border-color: var(--pink); color: var(--pink-dark);
  box-shadow: var(--shadow-soft); transform: translateY(-2px);
}
.pool-title {
  font-size: 1.2rem; font-weight: 700;
  background: linear-gradient(135deg, #d4859b, #c4a0d0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ========== Lottery Section ========== */
.lottery-section {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 26px 24px;
  text-align: center;
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
}
.btn-lottery {
  display: inline-block;
  padding: 14px 48px;
  font-size: 1.05rem; font-weight: 700;
  letter-spacing: 0.04em;
  color: #fff;
  background: linear-gradient(135deg, #f0b8c8 0%, #e098ae 50%, #d4859b 100%);
  border: none; border-radius: 999px;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: 0 4px 16px rgba(212,133,155,0.28);
  position: relative; overflow: hidden;
}
.btn-lottery::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
  transform: translateX(-100%); transition: transform 0.6s;
}
.btn-lottery:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 26px rgba(212,133,155,0.4);
}
.btn-lottery:hover::after { transform: translateX(100%); }
.btn-lottery:active { transform: translateY(-1px) scale(0.97); }
.btn-lottery:disabled {
  opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none;
}
.btn-lottery:disabled::after { display: none; }

/* Lottery Result */
.result-area { margin-top: 22px; }
.result-card {
  display: inline-block;
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid var(--pink);
  border-radius: var(--radius-lg);
  padding: 18px 26px;
  box-shadow: 0 4px 22px rgba(212,133,155,0.18);
  animation: cardReveal 0.5s ease-out;
  min-width: 156px;
}
@keyframes cardReveal {
  0% { opacity: 0; transform: scale(0.7) rotateY(90deg); }
  60% { transform: scale(1.08) rotateY(-8deg); }
  100% { opacity: 1; transform: scale(1) rotateY(0); }
}
.result-hero-img {
  width: 116px; height: 116px;
  border-radius: 50%; object-fit: cover;
  border: 3px solid var(--pink);
  box-shadow: 0 0 18px var(--rose-glow);
  display: block; margin: 0 auto 10px;
  background: var(--lavender-light);
}
.result-hero-img[src=""], .result-hero-img:not([src]), .result-hero-img.error { display: none; }
.result-img-placeholder {
  width: 116px; height: 116px;
  border-radius: 50%;
  border: 3px dashed rgba(212,133,155,0.25);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 10px; font-size: 2.8rem; color: var(--text-dim);
}
.result-name {
  font-size: 1.25rem; font-weight: 700;
  color: var(--rose); letter-spacing: 0.04em;
}
.result-subtitle {
  font-size: 0.73rem; color: var(--text-dim); margin-top: 2px;
}

/* ========== Pool Management ========== */
.manage-section {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
}
.manage-section h3 {
  font-size: 0.93rem; font-weight: 700;
  color: var(--rose); margin-bottom: 12px; letter-spacing: 0.03em;
}
.input-row { display: flex; gap: 10px; flex-wrap: wrap; }
.input-row input {
  flex: 1; min-width: 140px;
  padding: 10px 16px; font-size: 0.92rem;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(232,160,180,0.18);
  border-radius: 999px; color: var(--text); outline: none;
  transition: border-color var(--transition);
}
.input-row input:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(232,160,180,0.08);
}
.input-row input::placeholder { color: var(--text-dim); }

.btn-sm {
  padding: 10px 22px; font-size: 0.86rem; font-weight: 600;
  border: none; border-radius: 999px; cursor: pointer;
  transition: all var(--transition); white-space: nowrap; letter-spacing: 0.03em;
}
.btn-sm:hover { transform: translateY(-2px); }
.btn-sm:active { transform: translateY(0) scale(0.96); }

.btn-add {
  background: linear-gradient(135deg, #a5d6a7, #81c784);
  color: #fff; box-shadow: 0 2px 10px rgba(129,199,132,0.2);
}
.btn-add:hover { box-shadow: 0 4px 16px rgba(129,199,132,0.35); }

.btn-del {
  background: linear-gradient(135deg, #ef9a9a, #e57373);
  color: #fff; box-shadow: 0 2px 10px rgba(229,115,115,0.2);
}
.btn-del:hover { box-shadow: 0 4px 16px rgba(229,115,115,0.35); }

.btn-clear {
  background: rgba(255,255,255,0.55); color: var(--danger);
  border: 1px solid rgba(239,83,80,0.2);
}
.btn-clear:hover {
  border-color: var(--danger); box-shadow: 0 0 8px rgba(239,83,80,0.12);
}

.btn-settings {
  background: rgba(255,255,255,0.55); color: var(--text-light);
  border: 1px solid var(--card-border);
}
.btn-settings:hover {
  border-color: var(--pink); box-shadow: 0 0 8px var(--rose-glow);
}

.btn-reset {
  background: linear-gradient(135deg, #ce93d8, #ba68c8);
  color: #fff; box-shadow: 0 2px 10px rgba(186,104,200,0.2);
}
.btn-reset:hover { box-shadow: 0 4px 16px rgba(186,104,200,0.35); }

.file-input {
  padding: 8px 12px; font-size: 0.82rem;
  background: rgba(255,255,255,0.55); color: var(--text-dim);
  border: 1px solid rgba(232,160,180,0.18); border-radius: 999px;
  outline: none; cursor: pointer; min-width: 180px;
}
.file-input::file-selector-button {
  padding: 6px 14px; border: none; border-radius: 999px;
  background: var(--pink-light); color: var(--pink-dark);
  font-weight: 600; cursor: pointer; margin-right: 8px;
  transition: background var(--transition);
}
.file-input::file-selector-button:hover {
  background: var(--pink);
}

/* ========== Hero List ========== */
.hero-list-section {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-card);
}
.hero-list-section h3 {
  font-size: 0.93rem; font-weight: 700;
  color: var(--rose); margin-bottom: 12px; letter-spacing: 0.03em;
}
.hero-list-empty {
  text-align: center; color: var(--text-dim); padding: 32px 0; font-size: 0.86rem;
}
.hero-list { display: flex; flex-wrap: wrap; gap: 9px; }
.hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(232,160,180,0.12);
  border-radius: 999px;
  padding: 5px 10px 5px 5px; font-size: 0.82rem;
  transition: all var(--transition); cursor: default;
}
.hero-tag:hover {
  border-color: var(--pink); box-shadow: 0 0 6px var(--rose-glow); transform: translateY(-1px);
}
.hero-tag-avatar {
  width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
  border: 1px solid rgba(232,160,180,0.25); background: var(--lavender-light);
}
.hero-tag-name { color: var(--text); font-weight: 500; }

/* ========== Toast / Modal ========== */
.toast-container {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  padding: 11px 24px; border-radius: 999px; font-size: 0.86rem; font-weight: 600;
  pointer-events: auto;
  animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in forwards;
  animation-delay: 0s, 2.2s;
  box-shadow: 0 4px 18px rgba(180,130,150,0.18); white-space: nowrap; text-align: center;
}
.toast.success { background: #e8f5e9; color: #43a047; border: 1px solid rgba(129,199,132,0.3); }
.toast.error   { background: #ffebee; color: #e53935; border: 1px solid rgba(229,115,115,0.3); }
.toast.info    { background: #ede7f6; color: #7e57c2; border: 1px solid rgba(179,157,219,0.3); }
@keyframes toastIn  { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-18px); } }

.modal-overlay {
  position: fixed; inset: 0; z-index: 8000;
  background: rgba(120,80,100,0.3);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--card-border); border-radius: var(--radius-lg);
  padding: 26px 24px; max-width: 350px; width: 90%;
  text-align: center; box-shadow: 0 10px 40px rgba(200,150,170,0.22);
}
.modal-box h4 { color: var(--rose); font-size: 1rem; margin-bottom: 8px; }
.modal-box p  { color: var(--text-dim); font-size: 0.86rem; margin-bottom: 18px; line-height: 1.5; }
.modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ========== Lottery Animation Overlay ========== */
.lottery-anim-overlay {
  position: fixed; inset: 0; z-index: 7500;
  background: rgba(254,248,250,0.9);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
}
.lottery-anim-box { text-align: center; }
.lottery-anim-name {
  font-size: 2.4rem; font-weight: 900;
  color: var(--rose);
  animation: nameFlash 0.08s ease-in-out infinite alternate;
  text-shadow: 0 0 28px var(--rose-glow);
}
@keyframes nameFlash {
  0% { opacity: 0.5; transform: scale(0.95); }
  100% { opacity: 1; transform: scale(1.05); }
}

/* ========== Button Row ========== */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* ========== Responsive ========== */
@media (max-width: 480px) {
  .container { padding: 12px 10px 40px; }
  .header { padding: 24px 0 14px; }
  .header-avatar { width: 72px; height: 72px; }
  .cd-banner { gap: 6px; margin-bottom: 16px; }
  .cd-banner-img { width: 68px; height: 68px; }
  .lane-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .lane-card { padding: 20px 10px 18px; }
  .lane-icon { width: 44px; height: 44px; font-size: 1.4rem; }
  .btn-lottery { padding: 12px 36px; font-size: 1rem; }
  .input-row { flex-direction: column; }
  .file-input { min-width: auto; width: 100%; }
  .btn-row { flex-direction: column; }
  .btn-sm { width: 100%; text-align: center; }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-layer">
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-portrait" style="background-image:url(陈都灵/陈都灵2.png)"></div>
  <div class="bg-portrait bottom" style="background-image:url(陈都灵/陈都灵1.png)"></div>
  <div class="bg-sparkles"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Main Container -->
<div class="container" id="app">

  <!-- ====== PAGE: Lane Selection ====== -->
  <div class="page active" id="page-select">
    <div class="header">

      <img class="cd-banner-img" src="陈都灵/陈都灵2.png" alt="陈都灵" onerror="this.style.display='none'">

        🎰 抽取英雄

        <button class="btn-sm btn-reset" onclick="confirmResetPool()">🔄 恢复默认</button>

<div id="modalContainer"></div>

<div id="lotteryOverlay"></div>

<script>
/* ================================================================
   赵宏宇专属奖池 — 跨设备同步版
   GitHub API + pool_data.json 实现多设备数据一致
   ================================================================ */

// ==================== CHEN DULING PORTRAIT ROTATION ====================

const CD_PORTRAITS = [
  '陈都灵/陈都灵1.png','陈都灵/陈都灵2.png','陈都灵/陈都灵3.png',
];
let cdIdx = 0, cdIdxBottom = 1;

function rotatePortraits() {
  cdIdx = (cdIdx + 1) % CD_PORTRAITS.length;
  cdIdxBottom = (cdIdxBottom + 1) % CD_PORTRAITS.length;
  const top = document.querySelector('.bg-portrait:not(.bottom)');
  const bot = document.querySelector('.bg-portrait.bottom');
  if (top) top.style.backgroundImage = `url(${CD_PORTRAITS[cdIdx]})`;
  if (bot) bot.style.backgroundImage = `url(${CD_PORTRAITS[cdIdxBottom]})`;
}

setInterval(rotatePortraits, 10000);

// ==================== CONFIGURATION ====================

const REPO_OWNER = 'tuyuxinprogrammer';
const REPO_NAME = 'zhaohongyu-hero-pool';
const DATA_FILE = 'pool_data.json';
const RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_FILE}`;
const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;
const IMG_API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/hero_img/`;

const LANES = [
  { id: 'jungle', name: '打野',   icon: '🌿', cls: 'jungle', dir: '打野'   },
  { id: 'mid',    name: '中单',   icon: '⚡', cls: 'mid',    dir: '中单'   },
  { id: 'slave',  name: '奴隶',   icon: '⛓️', cls: 'slave',  dir: '奴隶'   },
  { id: 'prison', name: '狱友',   icon: '🔒', cls: 'prison', dir: '狱友'   },
];

const DEFAULT_POOLS = {
  jungle: ['云中君','云缨','司马懿','娜可露露','嫦娥','暃','曜','李白','澜','百里玄策','铠','阿轲','雅典娜','露娜','韩信','马超'],
  mid:    ['上官婉儿','不知火舞','女娲','妲己','嫦娥','安琪拉','小乔','杨玉环','海月','王昭君','西施'],
  slave:  ['伽罗','公孙离','孙尚香','敖隐','狄仁杰','艾琳','虞姬','马可波罗','鲁班七号'],
  prison: ['元流之子','大乔','孙膑','少司缘','庄周','朵莉亚','瑶','空空儿','苏烈','蔡文姬','鬼谷子'],
};

const IMG_DIR = './hero_img/';
const IMG_EXTS = ['.png', '.jpg', '.jpeg', '.webp'];
const CACHE_KEY = 'zhy_pool_cache_v2';

// ==================== STATE ====================

let currentLane = null;
let currentImgUrl = {};
let poolData = {};        // { jungle: [...], mid: [...], slave: [...], prison: [...] }
let dataLoaded = false;
let gitHubToken = localStorage.getItem('zhy_gh_token') || '';
let poolFileSha = null;   // SHA of pool_data.json for API updates

// ==================== DATA LAYER ====================

function getPool(laneId) {
  return poolData[laneId] || [];
}

function getAllPools() {
  return { ...poolData };
}

async function loadFromGitHub() {
  try {
    // First priority: raw URL (always correct encoding, no auth needed)
    const rawResp = await fetch(RAW_URL + '?t=' + Date.now());
    if (rawResp.ok) {
      poolData = await rawResp.json();
    } else {
      throw new Error('Cannot load from raw URL');
    }

    // Also fetch SHA for later updates (needs token)
    if (gitHubToken) {
      try {
        const apiResp = await fetch(API_URL, {
          headers: { Authorization: `token ${gitHubToken}` }
        });
        if (apiResp.ok) {
          const apiData = await apiResp.json();
          poolFileSha = apiData.sha;
        }
      } catch(e) { /* SHA fetch failed, will work without it */ }
    }
  } catch (e) {
    // Fallback: localStorage cache
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try { poolData = JSON.parse(cached); } catch(e2) {}
    }
    // If still empty, use defaults
    if (!poolData || Object.keys(poolData).length === 0) {
      poolData = { ...DEFAULT_POOLS };
    }
  }
  // Ensure all 4 lanes exist
  for (const lane of LANES) {
    if (!poolData[lane.id]) poolData[lane.id] = [];
  }
  localStorage.setItem(CACHE_KEY, JSON.stringify(poolData));
  dataLoaded = true;
}

async function saveToGitHub() {
  if (!gitHubToken) {
    showToast('请先设置 GitHub Token（点击 ⚙️ 同步设置）', 'error');
    return false;
  }
  try {
    // Proper UTF-8 to base64 encoding
    const jsonStr = JSON.stringify(poolData, null, 2);
    const encoder = new TextEncoder();
    const bytes = encoder.encode(jsonStr);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    const content = btoa(binary);
    const body = {
      message: '🔄 更新奖池数据',
      content: content,
    };
    if (poolFileSha) body.sha = poolFileSha;

    const resp = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        Authorization: `token ${gitHubToken}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });

    if (resp.ok) {
      const result = await resp.json();
      poolFileSha = result.content.sha;
      localStorage.setItem(CACHE_KEY, JSON.stringify(poolData));
      return true;
    } else {
      const err = await resp.json();
      throw new Error(err.message || 'API error');
    }
  } catch (e) {
    localStorage.setItem(CACHE_KEY, JSON.stringify(poolData));
    showToast('同步失败: ' + e.message + '（已保存到本地）', 'error');
    return false;
  }
}

// ==================== IMAGE RESOLVER ====================

/**
 * Optimized probe: try .png directly first (99% of images), then fall back.
 * All hero images are .png in hero_img/ — no need to brute-force 24 combinations.
 */
function probeImage(heroName) {
  return new Promise((resolve) => {
    // Priority 1: hero_img/<name>.png — covers virtually all cases
    const fastPath = IMG_DIR + heroName + '.png';
    const img = new Image();
    img.onload = () => { currentImgUrl[heroName] = fastPath; resolve(fastPath); };
    img.onerror = () => {
      // Priority 2: try other extensions in hero_img/
      let extIdx = 0;
      const exts = ['.jpg', '.jpeg', '.webp'];
      function tryExt() {
        if (extIdx >= exts.length) {
          currentImgUrl[heroName] = null;
          resolve(null);
          return;
        }
        const url = IMG_DIR + heroName + exts[extIdx];
        const img2 = new Image();
        img2.onload = () => { currentImgUrl[heroName] = url; resolve(url); };
        img2.onerror = () => { extIdx++; tryExt(); };
        img2.src = url;
      }
      tryExt();
    };
    img.src = fastPath;
  });
}

async function prefetchHeroImage(heroName) {
  if (currentImgUrl[heroName] === undefined) {
    await probeImage(heroName);
    if (currentLane) refreshSingleHeroTag(heroName);
  }
}

function refreshSingleHeroTag(heroName) {
  const avatar = document.querySelector(`.hero-tag-avatar[data-hero="${escapeAttr(heroName)}"]`);
  if (avatar) {
    const url = currentImgUrl[heroName];
    if (url) { avatar.src = url; avatar.style.display = ''; }
  }
}

function escapeAttr(s) { return s.replace(/"/g, '&quot;').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeHTML(s) { const m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }; return s.replace(/[&<>"']/g, c => m[c]); }

// ==================== TOAST ====================

function showToast(msg, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
}

// ==================== MODAL ====================

function showModal(title, message, buttons) {
  const container = document.getElementById('modalContainer');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box"><h4>${title}</h4><p>${message}</p><div class="modal-buttons">${buttons.map((b,i) => `<button class="btn-sm ${b.cls||''}" data-idx="${i}">${b.label}</button>`).join('')}</div></div>`;
  overlay.querySelectorAll('.modal-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      if (buttons[idx] && buttons[idx].action) buttons[idx].action();
      closeModal(overlay);
    });
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(overlay); });
  container.appendChild(overlay);
}

function closeModal(overlay) {
  overlay.style.opacity = '0'; overlay.style.transition = 'opacity 0.2s';
  setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 200);
}

// ==================== PAGE NAVIGATION ====================

function switchPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById(pageId);
  if (target) target.classList.add('active');
}

function goToSelect() {
  currentLane = null; currentImgUrl = {};
  switchPage('page-select');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('lotteryOverlay').innerHTML = '';
  renderLaneGrid();
}

function enterLane(laneId) {
  currentLane = laneId; currentImgUrl = {};
  const lane = LANES.find(l => l.id === laneId);
  document.getElementById('poolTitle').textContent = (lane ? lane.icon + ' ' + lane.name : '') + ' 奖池';
  document.getElementById('heroNameInput').value = '';
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('lotteryOverlay').innerHTML = '';
  switchPage('page-pool');
  renderPool();        // Show hero names immediately
  prefetchAllImages();  // Load images in background
}

function prefetchAllImages() {
  const heroes = getPool(currentLane);
  const uncached = heroes.filter(name => currentImgUrl[name] === undefined);
  if (uncached.length > 0) {
    Promise.all(uncached.map(name => probeImage(name))).then(() => {
      renderHeroList(heroes); // Re-render when images arrive
    });
  }
}

// ==================== LANE GRID ====================

function renderLaneGrid() {
  const grid = document.getElementById('laneGrid');
  grid.innerHTML = LANES.map(lane => {
    const count = getPool(lane.id).length;
    return `<div class="lane-card" onclick="enterLane('${lane.id}')"><div class="lane-icon ${lane.cls}">${lane.icon}</div><div class="lane-name">${lane.name}</div><div class="lane-count">${count} 位英雄</div></div>`;
  }).join('');
}

// ==================== POOL RENDERING ====================

function renderPool() {
  const heroes = getPool(currentLane);
  renderHeroList(heroes);
  document.getElementById('heroCount').textContent = heroes.length;
}

function renderHeroList(heroes) {
  const container = document.getElementById('heroListContainer');
  document.getElementById('heroCount').textContent = heroes.length;
  if (heroes.length === 0) {
    container.innerHTML = '<div class="hero-list-empty">奖池为空，请先添加英雄</div>';
    return;
  }
  const list = document.createElement('div');
  list.className = 'hero-list';
  heroes.forEach(name => {
    const tag = document.createElement('span');
    tag.className = 'hero-tag';
    const url = currentImgUrl[name] || '';
    const imgDisplay = url ? '' : 'style="display:none"';
    tag.innerHTML = `<img class="hero-tag-avatar" data-hero="${escapeAttr(name)}" src="${escapeHTML(url)}" alt="${escapeHTML(name)}" ${imgDisplay} onerror="this.style.display='none'"><span class="hero-tag-name">${escapeHTML(name)}</span>`;
    list.appendChild(tag);
  });
  container.innerHTML = '';
  container.appendChild(list);
}

// ==================== LOTTERY ====================

function startLottery() {
  if (!currentLane) return;
  const heroes = getPool(currentLane);
  if (heroes.length === 0) { showToast('奖池为空，请先添加英雄！', 'error'); return; }

  const btn = document.getElementById('btnLottery');
  btn.disabled = true;

  const overlay = document.getElementById('lotteryOverlay');
  const heroNames = [...heroes];
  let flashCount = 0;
  const maxFlashes = 20;
  let flashInterval = 50;

  overlay.innerHTML = '<div class="lottery-anim-overlay"><div class="lottery-anim-box"><div class="lottery-anim-name" id="flashName"></div></div></div>';
  const flashName = document.getElementById('flashName');

  function flash() {
    flashName.textContent = heroNames[Math.floor(Math.random() * heroNames.length)];
    flashCount++;
    if (flashCount < maxFlashes) {
      flashInterval += flashCount * 4;
      setTimeout(flash, flashInterval);
    } else {
      const picked = heroNames[Math.floor(Math.random() * heroNames.length)];
      flashName.textContent = picked;
      setTimeout(() => { overlay.innerHTML = ''; showResult(picked); btn.disabled = false; }, 400);
    }
  }
  flash();
}

function showResult(heroName) {
  const area = document.getElementById('resultArea');
  const imgUrl = currentImgUrl[heroName];
  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `<div class="result-img-placeholder">🦸</div><div class="result-name">${escapeHTML(heroName)}</div><div class="result-subtitle">✦ 恭喜获得 ✦</div>`;
  area.innerHTML = '';
  area.appendChild(card);
  const placeholder = card.querySelector('.result-img-placeholder');

  function applyImage(url) {
    const img = document.createElement('img');
    img.className = 'result-hero-img'; img.src = url; img.alt = heroName;
    img.onerror = () => { img.remove(); placeholder.style.display = 'flex'; };
    img.onload = () => { placeholder.style.display = 'none'; };
    card.insertBefore(img, placeholder);
  }

  if (imgUrl) { applyImage(imgUrl); }
  else if (imgUrl === null) { placeholder.style.display = 'flex'; }
  else {
    probeImage(heroName).then(url => {
      if (url) applyImage(url); else placeholder.style.display = 'flex';
    });
  }
}

// ==================== POOL MANAGEMENT ====================

function savePoolAndSync(laneId) {
  localStorage.setItem(CACHE_KEY, JSON.stringify(poolData));
  saveToGitHub();
}

async function addHero() {
  if (!currentLane) return;
  const input = document.getElementById('heroNameInput');
  const fileInput = document.getElementById('heroImageInput');
  const rawName = input.value.trim();
  if (!rawName) { showToast('请输入英雄名称', 'error'); return; }
  const heroes = getPool(currentLane);
  if (heroes.includes(rawName)) { showToast('「' + rawName + '」已在奖池中', 'info'); input.value = ''; return; }

  // Handle image upload if provided
  if (fileInput && fileInput.files && fileInput.files[0]) {
    if (!gitHubToken) {
      showToast('需要设置 GitHub Token 才能上传图片', 'error');
      return;
    }
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const imgPath = 'hero_img/' + rawName + '.' + ext;
    try {
      showToast('正在上传图片…', 'info');
      const reader = new FileReader();
      const base64Content = await new Promise((resolve, reject) => {
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const imgResp = await fetch(IMG_API_URL + rawName + '.' + ext, {
        method: 'PUT',
        headers: {
          Authorization: `token ${gitHubToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          message: '🖼️ 上传 ' + rawName + ' 图片',
          content: base64Content,
        }),
      });
      if (!imgResp.ok && imgResp.status !== 422) {
        // 422 = file already exists, that's OK
        const err = await imgResp.json();
        throw new Error(err.message || '图片上传失败');
      }
    } catch (e) {
      showToast('图片上传失败: ' + e.message, 'error');
      return;
    }
  }

  heroes.push(rawName);
  poolData[currentLane] = heroes;
  savePoolAndSync(currentLane);
  input.value = '';
  if (fileInput) fileInput.value = '';
  showToast('「' + rawName + '」已加入奖池', 'success');
  prefetchHeroImage(rawName);
  renderPool();
}

function deleteHero() {
  if (!currentLane) return;
  const input = document.getElementById('heroNameInput');
  const rawName = input.value.trim();
  if (!rawName) { showToast('请输入要删除的英雄名称', 'error'); return; }
  const heroes = getPool(currentLane);
  const idx = heroes.indexOf(rawName);
  if (idx === -1) { showToast('「' + rawName + '」不在奖池中', 'error'); return; }
  heroes.splice(idx, 1);
  poolData[currentLane] = heroes;
  savePoolAndSync(currentLane);
  input.value = '';
  showToast('「' + rawName + '」已从奖池移除', 'info');
  renderPool();
}

function confirmClearPool() {
  if (!currentLane) return;
  const heroes = getPool(currentLane);
  if (heroes.length === 0) { showToast('奖池已为空', 'info'); return; }
  showModal('⚠️ 确认清空', '确定要清空当前分路奖池的全部 <b>' + heroes.length + '</b> 位英雄吗？此操作不可撤销。', [
    { label: '取消', cls: '', action: () => {} },
    { label: '确认清空', cls: 'btn-del', action: () => clearPool() },
  ]);
}

function clearPool() {
  poolData[currentLane] = [];
  savePoolAndSync(currentLane);
  currentImgUrl = {};
  renderPool();
  document.getElementById('resultArea').innerHTML = '';
  showToast('奖池已清空', 'info');
}

function confirmResetPool() {
  if (!currentLane) return;
  const defaults = DEFAULT_POOLS[currentLane] || [];
  showModal('🔄 确认恢复默认', '确定要将当前分路奖池恢复为默认的 <b>' + defaults.length + '</b> 位英雄吗？当前奖池将被覆盖。', [
    { label: '取消', cls: '', action: () => {} },
    { label: '确认恢复', cls: 'btn-reset', action: () => resetPool() },
  ]);
}

function resetPool() {
  const defaults = DEFAULT_POOLS[currentLane] || [];
  poolData[currentLane] = [...defaults];
  savePoolAndSync(currentLane);
  currentImgUrl = {};
  renderPool();
  document.getElementById('resultArea').innerHTML = '';
  showToast('奖池已恢复为默认（' + defaults.length + ' 位英雄）', 'success');
  prefetchAllImages();
}

// ==================== SETTINGS ====================

function openSettings() {
  showModal('⚙️ 跨设备同步设置',
    '<p style="text-align:left;font-size:0.82rem;">在其他设备上也能获得相同的奖池数据。<br><br>1. 去 <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--rose);">github.com/settings/tokens</a> 创建 Token（勾选 <b>repo</b> 权限）<br>2. 粘贴到下方输入框</p>' +
    '<input id="tokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx" style="width:100%;padding:10px;border-radius:999px;border:1px solid rgba(232,160,180,0.3);margin-bottom:8px;font-size:0.85rem" value="' + escapeHTML(gitHubToken) + '">' +
    '<p id="tokenStatus" style="font-size:0.75rem;color:var(--text-dim);margin-bottom:6px;">' + (gitHubToken ? '✅ Token 已设置 — 数据将自动同步' : '⚠️ 未设置 Token — 只能查看，无法同步修改') + '</p>',
    [
      { label: '清除 Token', cls: 'btn-clear', action: () => { gitHubToken = ''; localStorage.removeItem('zhy_gh_token'); showToast('Token 已清除', 'info'); } },
      { label: '💾 保存', cls: 'btn-add', action: () => {
        const val = document.getElementById('tokenInput').value.trim();
        if (val) {
          gitHubToken = val;
          localStorage.setItem('zhy_gh_token', val);
          showToast('Token 已保存 ✅ 修改将同步到全设备', 'success');
        }
      }},
    ]
  );
}

// ==================== KEYBOARD ====================

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.activeElement === document.getElementById('heroNameInput')) {
    e.preventDefault(); addHero();
  }
});

// ==================== INIT ====================

async function init() {
  // Clean old corrupted cache
  localStorage.removeItem('zhy_pool_cache');

  // Show page immediately with cached or default data
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    try { poolData = JSON.parse(cached); } catch(e) {}
  }
  if (!poolData || Object.keys(poolData).length === 0) {
    poolData = { ...DEFAULT_POOLS };
  }
  for (const lane of LANES) {
    if (!poolData[lane.id]) poolData[lane.id] = [];
  }
  dataLoaded = true;
  renderLaneGrid();

  // Silently refresh from GitHub in background
  loadFromGitHub().then(() => {
    renderLaneGrid();
    if (!gitHubToken) {
      setTimeout(() => showToast('提示：设置 Token 后可跨设备同步', 'info'), 800);
    }
  });

  console.log('%c🏆 赵宏宇专属奖池 %c已就绪', 'font-size:1.2em;color:#d4859b;', 'color:#b8a0ae;');
}

init();
</script>
