<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵宏宇专属奖池</title>
<style>
/* ========== CSS Reset & Variables ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #0a0a12;
  --bg-card: #141428;
  --bg-card-hover: #1a1a38;
  --gold: #d4a843;
  --gold-light: #f0d068;
  --gold-dark: #8b6914;
  --gold-glow: rgba(212, 168, 67, 0.35);
  --text: #e0dcc8;
  --text-dim: #8a8678;
  --accent-jungle: #2ecc71;
  --accent-mid: #3498db;
  --accent-slave: #e67e22;
  --accent-prison: #9b59b6;
  --danger: #e74c3c;
  --danger-hover: #c0392b;
  --radius: 12px;
  --radius-lg: 20px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,168,67,0.15);
  --shadow-card-hover: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(240,208,104,0.4);
  --shadow-gold: 0 0 30px rgba(212,168,67,0.25);
  --font-mono: 'Courier New', monospace;
}

html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ========== Animated Background ========== */
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
.bg-gradient {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(212,168,67,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 80% 70%, rgba(52,152,219,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(155,89,182,0.04) 0%, transparent 60%),
    linear-gradient(180deg, #0a0a18 0%, #0d0d22 30%, #101028 60%, #0a0a18 100%);
}
.bg-particles {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(212,168,67,0.3), transparent),
    radial-gradient(1px 1px at 25% 35%, rgba(240,208,104,0.25), transparent),
    radial-gradient(1px 1px at 40% 20%, rgba(212,168,67,0.2), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(240,208,104,0.2), transparent),
    radial-gradient(1px 1px at 70% 30%, rgba(212,168,67,0.25), transparent),
    radial-gradient(1px 1px at 85% 50%, rgba(240,208,104,0.15), transparent),
    radial-gradient(1px 1px at 15% 65%, rgba(212,168,67,0.2), transparent),
    radial-gradient(1px 1px at 30% 80%, rgba(240,208,104,0.18), transparent),
    radial-gradient(1px 1px at 60% 75%, rgba(212,168,67,0.22), transparent),
    radial-gradient(1px 1px at 80% 85%, rgba(240,208,104,0.16), transparent),
    radial-gradient(1px 1px at 50% 90%, rgba(212,168,67,0.2), transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.5; }
  100% { opacity: 1; }
}

/* ========== Layout ========== */
.container {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto; padding: 20px 16px 60px;
}

/* ========== Header ========== */
.header {
  text-align: center; padding: 32px 0 20px;
}
.header h1 {
  font-size: clamp(1.6rem, 5vw, 2.6rem);
  font-weight: 900;
  letter-spacing: 0.06em;
  background: linear-gradient(180deg, #f7e8a0 0%, #d4a843 30%, #8b6914 65%, #6b4e0a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 2px 8px rgba(212,168,67,0.5));
  line-height: 1.3;
}
.header .subtitle {
  font-size: 0.9rem; color: var(--text-dim);
  margin-top: 6px; letter-spacing: 0.1em;
}

/* ========== Page Switching ========== */
.page { display: none; }
.page.active { display: block; animation: fadeSlideIn 0.35s ease-out; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Lane Selection Grid ========== */
.lane-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  margin-top: 28px;
}
.lane-card {
  background: var(--bg-card);
  border: 1px solid rgba(212,168,67,0.2);
  border-radius: var(--radius-lg);
  padding: 28px 16px 24px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.lane-card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(212,168,67,0.08), transparent 70%);
  opacity: 0; transition: opacity var(--transition);
}
.lane-card:hover {
  transform: translateY(-6px);
  border-color: var(--gold);
  box-shadow: var(--shadow-card-hover);
}
.lane-card:hover::before { opacity: 1; }
.lane-card:active { transform: translateY(-2px); }

.lane-icon {
  width: 56px; height: 56px; margin: 0 auto 14px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
  position: relative; z-index: 1;
}
.lane-icon.jungle { background: rgba(46,204,113,0.15); box-shadow: 0 0 20px rgba(46,204,113,0.2); }
.lane-icon.mid    { background: rgba(52,152,219,0.15); box-shadow: 0 0 20px rgba(52,152,219,0.2); }
.lane-icon.slave  { background: rgba(230,126,34,0.15); box-shadow: 0 0 20px rgba(230,126,34,0.2); }
.lane-icon.prison { background: rgba(155,89,182,0.15); box-shadow: 0 0 20px rgba(155,89,182,0.2); }

.lane-name {
  font-size: 1.15rem; font-weight: 700; position: relative; z-index: 1;
  letter-spacing: 0.04em;
}
.lane-count {
  font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; position: relative; z-index: 1;
}

/* ========== Main Pool Page ========== */
.top-bar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
}
.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-card); color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px; padding: 8px 18px;
  font-size: 0.85rem; cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-back:hover {
  border-color: var(--gold);
  box-shadow: 0 0 12px var(--gold-glow);
  transform: translateY(-2px);
}
.pool-title {
  font-size: 1.3rem; font-weight: 700;
  background: linear-gradient(180deg, #f0d068, #d4a843);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ========== Lottery Section ========== */
.lottery-section {
  background: var(--bg-card);
  border: 1px solid rgba(212,168,67,0.25);
  border-radius: var(--radius-lg);
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow-card);
  margin-bottom: 20px;
}
.btn-lottery {
  display: inline-block;
  padding: 14px 48px;
  font-size: 1.1rem; font-weight: 700;
  letter-spacing: 0.05em;
  color: #1a1a0a;
  background: linear-gradient(135deg, #f0d068 0%, #d4a843 50%, #b8922e 100%);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: 0 4px 20px rgba(212,168,67,0.3), 0 0 0 2px rgba(240,208,104,0.2);
  position: relative;
  overflow: hidden;
}
.btn-lottery::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform 0.6s;
}
.btn-lottery:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(212,168,67,0.45), 0 0 0 3px rgba(240,208,104,0.35);
}
.btn-lottery:hover::after { transform: translateX(100%); }
.btn-lottery:active { transform: translateY(-1px) scale(0.97); }
.btn-lottery:disabled {
  opacity: 0.4; cursor: not-allowed; transform: none;
  box-shadow: none;
}
.btn-lottery:disabled::after { display: none; }

/* Lottery Result */
.result-area { margin-top: 24px; }
.result-card {
  display: inline-block;
  background: linear-gradient(180deg, #1a1a35 0%, #14142a 100%);
  border: 2px solid var(--gold);
  border-radius: var(--radius-lg);
  padding: 16px 24px;
  box-shadow: 0 0 30px rgba(212,168,67,0.3), 0 8px 32px rgba(0,0,0,0.4);
  animation: cardReveal 0.5s ease-out;
  min-width: 160px;
}
@keyframes cardReveal {
  0% { opacity: 0; transform: scale(0.7) rotateY(90deg); }
  60% { transform: scale(1.08) rotateY(-8deg); }
  100% { opacity: 1; transform: scale(1) rotateY(0); }
}
.result-hero-img {
  width: 120px; height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--gold);
  box-shadow: 0 0 20px var(--gold-glow);
  display: block;
  margin: 0 auto 10px;
  background: var(--bg-deep);
}
.result-hero-img[src=""], .result-hero-img:not([src]) {
  display: none;
}
.result-hero-img.error {
  display: none;
}
.result-img-placeholder {
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 3px dashed rgba(212,168,67,0.3);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 10px;
  font-size: 3rem;
  color: var(--text-dim);
}
.result-name {
  font-size: 1.3rem; font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.05em;
}
.result-subtitle {
  font-size: 0.75rem; color: var(--text-dim); margin-top: 2px;
}

/* ========== Pool Management ========== */
.manage-section {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-card);
  margin-bottom: 20px;
}
.manage-section h3 {
  font-size: 1rem; font-weight: 700;
  color: var(--gold);
  margin-bottom: 14px;
  letter-spacing: 0.04em;
}
.input-row {
  display: flex; gap: 10px; flex-wrap: wrap;
}
.input-row input {
  flex: 1; min-width: 140px;
  padding: 10px 16px;
  font-size: 0.95rem;
  background: var(--bg-deep);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  color: var(--text);
  outline: none;
  transition: border-color var(--transition);
}
.input-row input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 10px var(--gold-glow);
}
.input-row input::placeholder { color: var(--text-dim); }

.btn-sm {
  padding: 10px 22px;
  font-size: 0.9rem; font-weight: 600;
  border: none; border-radius: 999px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  letter-spacing: 0.03em;
}
.btn-sm:hover { transform: translateY(-2px); }
.btn-sm:active { transform: translateY(0) scale(0.96); }

.btn-add {
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  color: #fff;
  box-shadow: 0 2px 12px rgba(46,204,113,0.25);
}
.btn-add:hover { box-shadow: 0 4px 20px rgba(46,204,113,0.4); }

.btn-del {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: #fff;
  box-shadow: 0 2px 12px rgba(231,76,60,0.25);
}
.btn-del:hover { box-shadow: 0 4px 20px rgba(231,76,60,0.4); }

.btn-clear {
  background: var(--bg-deep);
  color: var(--danger);
  border: 1px solid rgba(231,76,60,0.3);
}
.btn-clear:hover {
  border-color: var(--danger);
  box-shadow: 0 0 12px rgba(231,76,60,0.2);
}

/* ========== Hero List ========== */
.hero-list-section {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-card);
}
.hero-list-section h3 {
  font-size: 1rem; font-weight: 700;
  color: var(--gold);
  margin-bottom: 14px;
  letter-spacing: 0.04em;
}
.hero-list-empty {
  text-align: center; color: var(--text-dim);
  padding: 32px 0;
  font-size: 0.9rem;
}
.hero-list {
  display: flex; flex-wrap: wrap; gap: 10px;
}
.hero-tag {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-deep);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 6px 10px 6px 6px;
  font-size: 0.85rem;
  transition: all var(--transition);
  cursor: default;
}
.hero-tag:hover {
  border-color: var(--gold);
  box-shadow: 0 0 8px var(--gold-glow);
  transform: translateY(-1px);
}
.hero-tag-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(212,168,67,0.3);
  background: var(--bg-deep);
}
.hero-tag-name {
  color: var(--text);
  font-weight: 500;
}

/* ========== Toast / Modal ========== */
.toast-container {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 0.9rem; font-weight: 600;
  pointer-events: auto;
  animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in forwards;
  animation-delay: 0s, 2.2s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  white-space: nowrap;
  text-align: center;
}
.toast.success { background: #1a3a1a; color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
.toast.error   { background: #3a1a1a; color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
.toast.info    { background: #1a2a3a; color: #3498db; border: 1px solid rgba(52,152,219,0.3); }
@keyframes toastIn  { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

.modal-overlay {
  position: fixed; inset: 0; z-index: 8000;
  background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: var(--bg-card);
  border: 1px solid rgba(212,168,67,0.25);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  max-width: 380px; width: 90%;
  text-align: center;
  box-shadow: 0 16px 64px rgba(0,0,0,0.7);
}
.modal-box h4 { color: var(--gold-light); font-size: 1.1rem; margin-bottom: 10px; }
.modal-box p  { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
.modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ========== Lottery Animation Overlay ========== */
.lottery-anim-overlay {
  position: fixed; inset: 0; z-index: 7500;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center;
}
.lottery-anim-box {
  text-align: center;
}
.lottery-anim-name {
  font-size: 2.5rem; font-weight: 900;
  color: var(--gold-light);
  animation: nameFlash 0.08s ease-in-out infinite alternate;
  text-shadow: 0 0 30px var(--gold-glow);
}
@keyframes nameFlash {
  0% { opacity: 0.5; transform: scale(0.95); }
  100% { opacity: 1; transform: scale(1.05); }
}

/* ========== Button Row ========== */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* ========== Responsive ========== */
@media (max-width: 480px) {
  .container { padding: 12px 10px 40px; }
  .header { padding: 20px 0 12px; }
  .lane-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .lane-card { padding: 20px 10px 18px; }
  .lane-icon { width: 44px; height: 44px; font-size: 1.4rem; }
  .btn-lottery { padding: 12px 36px; font-size: 1rem; }
  .input-row { flex-direction: column; }
  .btn-row { flex-direction: column; }
  .btn-sm { width: 100%; text-align: center; }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-layer">
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Main Container -->
<div class="container" id="app">

  <!-- ====== PAGE: Lane Selection ====== -->
  <div class="page active" id="page-select">
    <div class="header">
      <h1>赵宏宇专属奖池</h1>
      <p class="subtitle">✦ 选择你的战场 ✦</p>
    </div>
    <div class="lane-grid" id="laneGrid">
      <!-- JS populated -->
    </div>
  </div>

  <!-- ====== PAGE: Pool ====== -->
  <div class="page" id="page-pool">
    <div class="top-bar">
      <button class="btn-back" onclick="goToSelect()" title="返回选择分路">
        <span>◀</span> 返回选择
      </button>
      <span class="pool-title" id="poolTitle">—</span>
    </div>

    <!-- Lottery -->
    <div class="lottery-section">
      <button class="btn-lottery" id="btnLottery" onclick="startLottery()">
        🎰 抽取英雄
      </button>
      <div class="result-area" id="resultArea"></div>
    </div>

    <!-- Management -->
    <div class="manage-section">
      <h3>📋 奖池管理</h3>
      <div class="input-row">
        <input type="text" id="heroNameInput" placeholder="输入英雄名称…" maxlength="60" autocomplete="off">
        <button class="btn-sm btn-add" onclick="addHero()">➕ 添加英雄</button>
        <button class="btn-sm btn-del" onclick="deleteHero()">➖ 删除英雄</button>
      </div>
      <div class="btn-row">
        <button class="btn-sm btn-clear" onclick="confirmClearPool()">🗑 清空奖池</button>
      </div>
    </div>

    <!-- Hero List -->
    <div class="hero-list-section">
      <h3>👥 当前奖池英雄 (<span id="heroCount">0</span>)</h3>
      <div id="heroListContainer">
        <div class="hero-list-empty">奖池为空，请先添加英雄</div>
      </div>
    </div>
  </div>

</div>

<!-- ====== Modal Container ====== -->
<div id="modalContainer"></div>

<!-- ====== Lottery Animation Overlay ====== -->
<div id="lotteryOverlay"></div>

<script>
/* ================================================================
   赵宏宇专属奖池 — 纯前端英雄抽奖系统
   ================================================================ */

// ==================== CONFIGURATION ====================

const LANES = [
  { id: 'jungle', name: '打野',   icon: '🌿', cls: 'jungle', dir: '打野'   },
  { id: 'mid',    name: '中单',   icon: '⚡', cls: 'mid',    dir: '中单'   },
  { id: 'slave',  name: '奴隶',   icon: '⛓️', cls: 'slave',  dir: '奴隶'   },
  { id: 'prison', name: '狱友',   icon: '🔒', cls: 'prison', dir: '狱友'   },
];

// 每个分路的默认英雄（首次访问时自动填充）
const DEFAULT_POOLS = {
  jungle: ['云中君','云缨','司马懿','娜可露露','嫦娥','暃','曜','李白','澜','百里玄策','铠','阿轲','雅典娜','露娜','韩信','马超'],
  mid:    ['上官婉儿','不知火舞','女娲','妲己','嫦娥','安琪拉','小乔','杨玉环','海月','王昭君','西施'],
  slave:  ['伽罗','公孙离','孙尚香','敖隐','狄仁杰','艾琳','虞姬','马可波罗','鲁班七号'],
  prison: ['元流之子','大乔','孙膑','少司缘','庄周','朵莉亚','瑶','空空儿','苏烈','蔡文姬','鬼谷子'],
};

const IMG_DIR = './hero_img/';
const IMG_EXTS = ['.png', '.jpg', '.jpeg', '.webp'];
const STORAGE_PREFIX = 'zhy_pool_';
const INIT_FLAG_KEY = STORAGE_PREFIX + 'initialized';

// ==================== STATE ====================

let currentLane = null;   // current lane id
let currentImgUrl = {};   // cache: heroName -> resolved img URL

// ==================== STORAGE HELPERS ====================

function storageKey(laneId) {
  return STORAGE_PREFIX + laneId;
}

function getPool(laneId) {
  try {
    const raw = localStorage.getItem(storageKey(laneId));
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function savePool(laneId, heroes) {
  localStorage.setItem(storageKey(laneId), JSON.stringify(heroes));
}

// ==================== IMAGE RESOLVER ====================

/**
 * Build ordered search paths for a hero image (priority high → low):
 *  1. hero_img/<name>.<ext>               — flat shared folder
 *  2. hero_img/<currentLaneDir>/<name>.<ext> — lane subfolder inside hero_img
 *  3. ./<currentLaneDir>/<name>.<ext>        — root-level lane folder
 *  4–. hero_img + root other lane dirs, then root-level other lane dirs
 */
function buildImagePaths(heroName, ext) {
  const paths = [];
  // Priority 1: flat hero_img folder
  paths.push(IMG_DIR + heroName + ext);
  // Priority 2: current lane inside hero_img + root-level current lane
  if (currentLane) {
    const lane = LANES.find(l => l.id === currentLane);
    if (lane) {
      paths.push(IMG_DIR + lane.dir + '/' + heroName + ext);
      paths.push('./' + lane.dir + '/' + heroName + ext);
    }
  }
  // Priority 3+: other lanes (hero_img subdirs, then root-level dirs)
  for (const l of LANES) {
    if (l.id !== currentLane) {
      paths.push(IMG_DIR + l.dir + '/' + heroName + ext);
    }
  }
  for (const l of LANES) {
    if (l.id !== currentLane) {
      paths.push('./' + l.dir + '/' + heroName + ext);
    }
  }
  return paths;
}

/**
 * Async probe: try each (path × extension) combo, return the first that loads.
 * Caches the result so subsequent lookups are instant.
 */
function probeImage(heroName) {
  return new Promise((resolve) => {
    // Flatten: for each extension, try all paths before moving to next ext
    const combos = [];
    for (const ext of IMG_EXTS) {
      for (const path of buildImagePaths(heroName, ext)) {
        combos.push(path);
      }
    }
    let idx = 0;
    function tryNext() {
      if (idx >= combos.length) {
        currentImgUrl[heroName] = null; // cache miss
        resolve(null);
        return;
      }
      const url = combos[idx];
      const img = new Image();
      img.onload = () => {
        currentImgUrl[heroName] = url;
        resolve(url);
      };
      img.onerror = () => {
        idx++;
        tryNext();
      };
      img.src = url;
    }
    tryNext();
  });
}

/**
 * Pre-resolve image for a hero and re-render its tag if visible.
 */
async function prefetchHeroImage(heroName) {
  if (currentImgUrl[heroName] === undefined) {
    await probeImage(heroName);
    if (currentLane) {
      refreshSingleHeroTag(heroName);
    }
  }
}

function refreshSingleHeroTag(heroName) {
  const avatar = document.querySelector(`.hero-tag-avatar[data-hero="${escapeAttr(heroName)}"]`);
  if (avatar) {
    const url = currentImgUrl[heroName];
    if (url) {
      avatar.src = url;
      avatar.style.display = '';
    }
  }
}

function escapeAttr(s) {
  return s.replace(/"/g, '&quot;').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escapeHTML(s) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return s.replace(/[&<>"']/g, c => map[c]);
}

// ==================== TOAST ====================

function showToast(msg, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 2600);
}

// ==================== MODAL ====================

function showModal(title, message, buttons) {
  const container = document.getElementById('modalContainer');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h4>${title}</h4>
      <p>${message}</p>
      <div class="modal-buttons">
        ${buttons.map((b, i) =>
          `<button class="btn-sm ${b.cls || ''}" data-idx="${i}">${b.label}</button>`
        ).join('')}
      </div>
    </div>`;
  overlay.querySelectorAll('.modal-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      if (buttons[idx] && buttons[idx].action) {
        buttons[idx].action();
      }
      closeModal(overlay);
    });
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal(overlay);
  });
  container.appendChild(overlay);
}

function closeModal(overlay) {
  overlay.style.opacity = '0';
  overlay.style.transition = 'opacity 0.2s';
  setTimeout(() => {
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  }, 200);
}

// ==================== PAGE NAVIGATION ====================

function switchPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById(pageId);
  if (target) target.classList.add('active');
}

function goToSelect() {
  currentLane = null;
  currentImgUrl = {};
  switchPage('page-select');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('lotteryOverlay').innerHTML = '';
  renderLaneGrid();
}

function enterLane(laneId) {
  currentLane = laneId;
  currentImgUrl = {};
  const lane = LANES.find(l => l.id === laneId);
  document.getElementById('poolTitle').textContent = (lane ? lane.icon + ' ' + lane.name : '') + ' 奖池';
  document.getElementById('heroNameInput').value = '';
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('lotteryOverlay').innerHTML = '';
  switchPage('page-pool');
  renderPool();
  // Prefetch images for all heroes in the pool
  prefetchAllImages();
}

async function prefetchAllImages() {
  const heroes = getPool(currentLane);
  for (const name of heroes) {
    if (currentImgUrl[name] === undefined) {
      await probeImage(name);
    }
  }
  renderHeroList(heroes);
}

// ==================== LANE GRID ====================

function renderLaneGrid() {
  const grid = document.getElementById('laneGrid');
  grid.innerHTML = LANES.map(lane => {
    const count = getPool(lane.id).length;
    return `
      <div class="lane-card" onclick="enterLane('${lane.id}')">
        <div class="lane-icon ${lane.cls}">${lane.icon}</div>
        <div class="lane-name">${lane.name}</div>
        <div class="lane-count">${count} 位英雄</div>
      </div>`;
  }).join('');
}

// ==================== POOL RENDERING ====================

function renderPool() {
  const heroes = getPool(currentLane);
  renderHeroList(heroes);
  document.getElementById('heroCount').textContent = heroes.length;
}

function renderHeroList(heroes) {
  const container = document.getElementById('heroListContainer');
  document.getElementById('heroCount').textContent = heroes.length;
  if (heroes.length === 0) {
    container.innerHTML = '<div class="hero-list-empty">奖池为空，请先添加英雄</div>';
    return;
  }
  const list = document.createElement('div');
  list.className = 'hero-list';
  heroes.forEach(name => {
    const tag = document.createElement('span');
    tag.className = 'hero-tag';
    const url = currentImgUrl[name] || '';
    const imgDisplay = url ? '' : 'style="display:none"';
    tag.innerHTML = `
      <img class="hero-tag-avatar" data-hero="${escapeAttr(name)}" src="${escapeHTML(url)}" alt="${escapeHTML(name)}" ${imgDisplay} onerror="this.style.display='none'">
      <span class="hero-tag-name">${escapeHTML(name)}</span>`;
    list.appendChild(tag);
  });
  container.innerHTML = '';
  container.appendChild(list);
}

// ==================== LOTTERY ====================

function startLottery() {
  if (!currentLane) return;
  const heroes = getPool(currentLane);
  if (heroes.length === 0) {
    showToast('奖池为空，请先添加英雄！', 'error');
    return;
  }

  const btn = document.getElementById('btnLottery');
  btn.disabled = true;

  // Flash animation
  const overlay = document.getElementById('lotteryOverlay');
  const heroNames = [...heroes];
  let flashCount = 0;
  const maxFlashes = 20;
  let flashInterval = 50;

  overlay.innerHTML = '<div class="lottery-anim-overlay"><div class="lottery-anim-box"><div class="lottery-anim-name" id="flashName"></div></div></div>';

  const flashName = document.getElementById('flashName');

  function flash() {
    const randomName = heroNames[Math.floor(Math.random() * heroNames.length)];
    flashName.textContent = randomName;
    flashCount++;
    if (flashCount < maxFlashes) {
      // Gradually slow down
      flashInterval += flashCount * 4;
      setTimeout(flash, flashInterval);
    } else {
      // Final pick
      const picked = heroNames[Math.floor(Math.random() * heroNames.length)];
      flashName.textContent = picked;
      // Hold briefly then resolve
      setTimeout(() => {
        overlay.innerHTML = '';
        showResult(picked);
        btn.disabled = false;
      }, 400);
    }
  }
  flash();
}

function showResult(heroName) {
  const area = document.getElementById('resultArea');
  const imgUrl = currentImgUrl[heroName];

  // Render initial card
  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <div class="result-img-placeholder">🦸</div>
    <div class="result-name">${escapeHTML(heroName)}</div>
    <div class="result-subtitle">✦ 恭喜获得 ✦</div>`;
  area.innerHTML = '';
  area.appendChild(card);

  const placeholder = card.querySelector('.result-img-placeholder');

  function applyImage(url) {
    const img = document.createElement('img');
    img.className = 'result-hero-img';
    img.src = url;
    img.alt = heroName;
    img.onerror = () => {
      img.remove();
      placeholder.style.display = 'flex';
    };
    img.onload = () => {
      placeholder.style.display = 'none';
    };
    card.insertBefore(img, placeholder);
  }

  if (imgUrl) {
    // Already cached — show immediately
    applyImage(imgUrl);
  } else if (imgUrl === null) {
    // Previously probed & miss — keep placeholder
    placeholder.style.display = 'flex';
  } else {
    // Not probed yet — try now and update card on resolve
    probeImage(heroName).then(url => {
      if (url) applyImage(url);
      else placeholder.style.display = 'flex';
    });
  }
}

// ==================== POOL MANAGEMENT ====================

function addHero() {
  if (!currentLane) return;
  const input = document.getElementById('heroNameInput');
  const rawName = input.value.trim();
  if (!rawName) {
    showToast('请输入英雄名称', 'error');
    return;
  }
  const heroes = getPool(currentLane);
  if (heroes.includes(rawName)) {
    showToast('「' + rawName + '」已在奖池中', 'info');
    input.value = '';
    return;
  }
  heroes.push(rawName);
  savePool(currentLane, heroes);
  input.value = '';
  showToast('「' + rawName + '」已加入奖池', 'success');
  // Prefetch image
  prefetchHeroImage(rawName);
  renderPool();
}

function deleteHero() {
  if (!currentLane) return;
  const input = document.getElementById('heroNameInput');
  const rawName = input.value.trim();
  if (!rawName) {
    showToast('请输入要删除的英雄名称', 'error');
    return;
  }
  const heroes = getPool(currentLane);
  const idx = heroes.indexOf(rawName);
  if (idx === -1) {
    showToast('「' + rawName + '」不在奖池中', 'error');
    return;
  }
  heroes.splice(idx, 1);
  savePool(currentLane, heroes);
  input.value = '';
  showToast('「' + rawName + '」已从奖池移除', 'info');
  renderPool();
}

function confirmClearPool() {
  if (!currentLane) return;
  const heroes = getPool(currentLane);
  if (heroes.length === 0) {
    showToast('奖池已为空', 'info');
    return;
  }
  showModal(
    '⚠️ 确认清空',
    '确定要清空当前分路奖池的全部 <b>' + heroes.length + '</b> 位英雄吗？此操作不可撤销。',
    [
      { label: '取消', cls: '', action: () => {} },
      { label: '确认清空', cls: 'btn-del', action: () => clearPool() },
    ]
  );
}

function clearPool() {
  savePool(currentLane, []);
  currentImgUrl = {};
  renderPool();
  document.getElementById('resultArea').innerHTML = '';
  showToast('奖池已清空', 'info');
}

// ==================== KEYBOARD ====================

document.addEventListener('keydown', (e) => {
  // Enter in input triggers add
  if (e.key === 'Enter' && document.activeElement === document.getElementById('heroNameInput')) {
    e.preventDefault();
    addHero();
  }
});

// ==================== INIT ====================

function initPools() {
  // Check if pools have been initialized before
  if (localStorage.getItem(INIT_FLAG_KEY)) return;
  // First visit — pre-populate each lane with default heroes
  for (const lane of LANES) {
    const existing = getPool(lane.id);
    if (existing.length === 0 && DEFAULT_POOLS[lane.id]) {
      savePool(lane.id, [...DEFAULT_POOLS[lane.id]]);
    }
  }
  localStorage.setItem(INIT_FLAG_KEY, '1');
}

function init() {
  initPools();
  renderLaneGrid();
}

init();
